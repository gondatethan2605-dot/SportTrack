<!doctype html>
<html lang="fr" data-theme="dark" data-accent="violet" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SportTrack — Votre Carnet Sport & Musculation</title>
    <meta name="description" content="Application personnelle de sport et musculation 100% hors ligne, gratuite et installable (PWA) avec suivi d'entraînement, statistiques et progression." />
    <meta property="og:title" content="SportTrack — Votre Carnet Sport & Musculation" />

    <meta name="theme-color" content="#09090d" />

    <!-- LOT 6 item 16: appearance defaults are set directly on <html> so the
         very first paint has NO theme flash (dark + violet = current design).
         main.tsx re-applies them from the saved settings before React mounts. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Teko:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[var(--app-bg)] text-[var(--app-text)] antialiased selection:bg-[rgb(var(--accent-rgb)/0.55)] selection:text-white min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/sw-register.js" defer></script>
